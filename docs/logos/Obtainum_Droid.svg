<svg xmlns="http://w3.org" width="270" height="90" viewBox="0 0 270 90">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position: relative; width: 270px; height: 90px; margin: 0; padding: 0;">
      <!-- Haupt-Badge (Dein hochgeladenes Obtainium-Bild als Base64) -->
      <img src="data:image/png;base64," style="height: 90px; display: block; border: 0;" />
      
      <!-- Overlay-Icon (From wikimedia) -->
      <img src="data:image/svg+xml;base64," style="position: absolute; top: 5px; right: 5px; height: 25px; background: rgba(0,0,0,0.6); padding: 4px; border-radius: 50%;" />
    </div>
  </foreignObject>
</svg>
